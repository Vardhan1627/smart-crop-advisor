<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Language</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="bg-overlay"></div>
<div class="login-box">
  <div class="farmer-icon">🌾👨‍🌾</div>
  <h1>Welcome Farmer</h1>
 <p style="font-weight: 800; font-size: 1.2rem; background: linear-gradient(90deg, #1b5e20, #f9a825); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block;">Choose your preferred language to view crop details</p>
</span>
  <select id="language">
    <option value="en">🇬🇧 English</option>
    <option value="te">🇮🇳 తెలుగు</option>
    <option value="hi">🇮🇳 हिन्दी</option>
  </select>
  <button onclick="saveLanguage()">Continue →</button>
</div>

<script>
function saveLanguage() {
  const lang = document.getElementById('language').value;
  localStorage.setItem('farmerLanguage', lang);
  window.location.href = 'index.html';
}
</script>
</body>
</html>
